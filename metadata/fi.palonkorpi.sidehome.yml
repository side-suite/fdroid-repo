Summary: A calm, ambient launcher for the SP-01

Description: |-
  A calm, ambient home-screen launcher for the Sidephone SP-01 — a window onto
  your day, not a wall of apps.

  The home screen shows what matters now: the time, the weather, and the few
  apps you actually reach for. Everything else lives in a library one swipe
  away, searchable with the keypad and browsable by category.

  Built natively in Jetpack Compose for a 2.8-inch screen and hardware keys, so
  it is fully drivable without touching the display.
