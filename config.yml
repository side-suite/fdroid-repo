# SideSuite App Pack — fdroidserver config.
#
# repo_url is PERMANENT. It is baked into the signed index, stored by every
# client that adds the pack, and printed into every QR code ever published.
# Changing the host later is free. Changing this address strands every printed
# QR and every installed client. Do not edit it casually.
repo_url: https://fdroid.sidesuite.app/fdroid/repo

repo_name: SideSuite
repo_description: >-
  SideType, SideCall and SideHome — open-source apps for the Sidephone SP-01.
  Built by Oliver Palonkorpi. Not affiliated with Sidephone.
repo_icon: icon.png

# Literal path, NOT {env: ...} — `keystore: {env: ...}` is broken upstream
# (fdroidserver#870): fill_config_defaults path-expands `keystore` before lazy
# env resolution. CI writes this file from a base64 secret before running.
keystore: sidesuite-repo.p12
repo_keyalias: sidesuite

# {env: VAR} IS the correct secrets syntax here, and is verified working
# (fdroidserver 2.4.5, 2026-07-30). Not ${VAR}.
keystorepass: {env: KEYSTOREPASS}
keypass: {env: KEYPASS}

# Archiving disabled: every fetched version stays in the MAIN index. This is
# load-bearing, not tidiness. scripts/fetch-apks.sh deliberately fetches the
# last few releases per app so that clients holding a stale index can still
# download the filename they know about (see the comment at the top of that
# script). Archiving would move exactly those older APKs into an archive repo
# that no client is subscribed to, which reintroduces the 404 this prevents.
archive_older: 0
